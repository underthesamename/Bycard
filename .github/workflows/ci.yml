name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          APP_ENV: production
          API_UPSTREAM_URL: https://api.example.com

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: bycard
          POSTGRES_PASSWORD: bycard-ci-only
          POSTGRES_DB: bycard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bycard -d bycard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bycard:bycard-ci-only@127.0.0.1:5432/bycard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p bycard-api --bin check-config --locked
        env:
          APP_ENV: production
          API_HOST: 0.0.0.0
          API_PORT: 8080
          WEB_ORIGIN: https://app.example.com
          SESSION_HMAC_KEY: ci-example-key-with-at-least-thirty-two-bytes
          SESSION_TTL_SECONDS: 2592000
          SESSION_IDLE_TTL_SECONDS: 604800
          SESSION_TOUCH_INTERVAL_SECONDS: 300
          CSRF_TTL_SECONDS: 1800
          DATABASE_URL: postgresql://user:password@db.example/bycard?sslmode=verify-full
      - run: cargo build --workspace --locked
