name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment files
        run: |
          set -eu
          bash -n scripts/smoke-production.sh
          apps/web/node_modules/.bin/prettier --check \
            .github/workflows/production-smoke.yml \
            docs/operations/application-deployment.md \
            render.yaml
          python3 -c 'import tomllib; tomllib.load(open("netlify.toml", "rb"))'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          APP_ENV: production
          API_UPSTREAM_URL: https://api.example.com

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: bycard
          POSTGRES_PASSWORD: bycard-ci-only
          POSTGRES_DB: bycard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bycard -d bycard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bycard:bycard-ci-only@127.0.0.1:5432/bycard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p bycard-api --bin check-config --locked
        env:
          APP_ENV: production
          API_HOST: 0.0.0.0
          API_PORT: 8080
          WEB_ORIGIN: https://app.example.com
          SESSION_HMAC_KEY: ci-example-key-with-at-least-thirty-two-bytes
          SESSION_TTL_SECONDS: 2592000
          SESSION_IDLE_TTL_SECONDS: 604800
          SESSION_TOUCH_INTERVAL_SECONDS: 300
          CSRF_TTL_SECONDS: 1800
          DATABASE_URL: postgresql://user:password@db.example/bycard?sslmode=verify-full
      - run: cargo build --workspace --locked

  api-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: bycard
          POSTGRES_PASSWORD: bycard-ci-only
          POSTGRES_DB: bycard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bycard -d bycard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag bycard-api:ci .
      - name: Verify hardened runtime
        run: |
          set -eu
          test "$(docker image inspect --format '{{.Config.User}}' bycard-api:ci)" = "65532:65532"

          container=bycard-api-smoke
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env APP_ENV=test \
            --env API_HOST=127.0.0.1 \
            --env API_PORT=8080 \
            --env WEB_ORIGIN=http://127.0.0.1:3000 \
            --env SESSION_HMAC_KEY=ci-container-key-with-at-least-thirty-two-bytes \
            --env SESSION_TTL_SECONDS=2592000 \
            --env SESSION_IDLE_TTL_SECONDS=604800 \
            --env SESSION_TOUCH_INTERVAL_SECONDS=300 \
            --env CSRF_TTL_SECONDS=1800 \
            --env DATABASE_URL=postgresql://bycard:bycard-ci-only@127.0.0.1:5432/bycard \
            bycard-api:ci

          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

  database-operations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: bycard_owner
          POSTGRES_PASSWORD: bycard-owner-ci-only
          POSTGRES_DB: bycard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bycard_owner -d bycard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGSSLMODE: disable
      PGCHANNELBINDING: disable
    steps:
      - uses: actions/checkout@v4
      - name: Build database operations image
        run: docker build --target operations --tag bycard-database-operations:ci .
      - name: Create restricted database roles
        env:
          PGDATABASE: bycard
          PGUSER: bycard_owner
          PGPASSWORD: bycard-owner-ci-only
        run: |
          docker run --rm --network host \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE \
            --env PGUSER \
            --env PGPASSWORD \
            postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --command="CREATE ROLE bycard_app LOGIN PASSWORD 'bycard-app-ci-only'; CREATE ROLE bycard_backup LOGIN PASSWORD 'bycard-backup-ci-only'"
      - name: Apply migrations and import catalog idempotently
        env:
          DATABASE_URL: postgresql://bycard_app:bycard-app-ci-only@127.0.0.1:5432/bycard
          DATABASE_MIGRATION_URL: postgresql://bycard_owner:bycard-owner-ci-only@127.0.0.1:5432/bycard
          DATABASE_BACKUP_ROLE: bycard_backup
        run: |
          docker run --rm --network host \
            --env APP_ENV \
            --env DATABASE_URL \
            --env DATABASE_MIGRATION_URL \
            --env DATABASE_BACKUP_ROLE \
            bycard-database-operations:ci migrate
          docker run --rm --network host \
            --env APP_ENV \
            --env DATABASE_URL \
            --env DATABASE_MIGRATION_URL \
            --env DATABASE_BACKUP_ROLE \
            bycard-database-operations:ci migrate
          docker run --rm --network host \
            --env APP_ENV \
            --env DATABASE_URL \
            --volume "$GITHUB_WORKSPACE/fixtures/demo-catalog:/fixtures:ro" \
            bycard-database-operations:ci import-demo /fixtures/catalog.json
          docker run --rm --network host \
            --env APP_ENV \
            --env DATABASE_URL \
            --volume "$GITHUB_WORKSPACE/fixtures/demo-catalog:/fixtures:ro" \
            bycard-database-operations:ci import-demo /fixtures/catalog.json
          docker run --rm --network host \
            --env APP_ENV \
            --env DATABASE_URL \
            bycard-database-operations:ci verify
      - name: Verify least-privilege database roles
        run: |
          if docker run --rm --network host \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE=bycard \
            --env PGUSER=bycard_app \
            --env PGPASSWORD=bycard-app-ci-only \
            postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --command='BEGIN; CREATE TABLE forbidden_app_table (id INTEGER); ROLLBACK;'; then
            echo "application role unexpectedly created a table" >&2
            exit 1
          fi
          if docker run --rm --network host \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE=bycard \
            --env PGUSER=bycard_backup \
            --env PGPASSWORD=bycard-backup-ci-only \
            postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --command='BEGIN; UPDATE sets SET name = name; ROLLBACK;'; then
            echo "backup role unexpectedly modified catalog data" >&2
            exit 1
          fi
      - name: Encrypt, decrypt, and restore a logical backup
        env:
          PGUSER: bycard_backup
          PGPASSWORD: bycard-backup-ci-only
          BACKUP_DIRECTORY: /backup
          BACKUP_NAME: bycard-ci.dump
          BACKUP_ENCRYPTION_KEY: bycard-ci-backup-key-with-at-least-thirty-two-characters
        run: |
          mkdir -p "$RUNNER_TEMP/bycard-backup"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env APP_ENV \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE=bycard \
            --env PGUSER \
            --env PGPASSWORD \
            --env PGSSLMODE \
            --env PGCHANNELBINDING \
            --env BACKUP_DIRECTORY \
            --env BACKUP_NAME \
            --volume "$GITHUB_WORKSPACE/scripts/postgres:/scripts:ro" \
            --volume "$RUNNER_TEMP/bycard-backup:/backup" \
            postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            /scripts/backup.sh

          backup_file="$RUNNER_TEMP/bycard-backup/bycard-ci.dump"
          encrypted_backup_file="$backup_file.gpg"
          decrypted_backup_file="$RUNNER_TEMP/bycard-backup/bycard-ci-restored.dump"
          BACKUP_FILE="$backup_file" \
            ENCRYPTED_BACKUP_FILE="$encrypted_backup_file" \
            MAX_ENCRYPTED_BACKUP_BYTES=33554432 \
            scripts/postgres/encrypt-backup.sh
          rm -f -- "$backup_file" "$backup_file.sha256"
          ENCRYPTED_BACKUP_FILE="$encrypted_backup_file" \
            BACKUP_FILE="$decrypted_backup_file" \
            scripts/postgres/decrypt-backup.sh

          docker run --rm --network host \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE=postgres \
            --env PGUSER=bycard_owner \
            --env PGPASSWORD=bycard-owner-ci-only \
            postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --command='CREATE DATABASE bycard_restore_test'
          docker run --rm --network host \
            --env APP_ENV \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE=bycard_restore_test \
            --env PGUSER=bycard_owner \
            --env PGPASSWORD=bycard-owner-ci-only \
            --env PGSSLMODE \
            --env PGCHANNELBINDING \
            --env BACKUP_FILE=/backup/bycard-ci-restored.dump \
            --volume "$GITHUB_WORKSPACE/scripts/postgres:/scripts:ro" \
            --volume "$RUNNER_TEMP/bycard-backup:/backup:ro" \
            postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            /scripts/restore-empty-database.sh
          docker run --rm --network host \
            --env APP_ENV \
            --env DATABASE_URL=postgresql://bycard_owner:bycard-owner-ci-only@127.0.0.1:5432/bycard_restore_test \
            bycard-database-operations:ci verify
