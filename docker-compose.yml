name: bycard

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bycard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bycard-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-bycard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - bycard-postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  bycard-postgres-data:
